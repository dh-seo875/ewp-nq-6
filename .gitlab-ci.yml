stages:
  - verify
  - build

default:
  tags:
    - windows-keil-v525

verify_repository:
  stage: verify
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ci\verify.ps1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

build_firmware:
  stage: build
  script:
    - .\ci\build.bat
  artifacts:
    when: always
    name: "iewp-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/
    expire_in: 90 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^feature(\/|-).+$/'
